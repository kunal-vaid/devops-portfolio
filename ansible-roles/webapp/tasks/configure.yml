---
- name: Remove the default nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  notify: Reload nginx
  become: true

- name: Deploy nginx vhost for the app
  ansible.builtin.template:
    src: nginx-vhost.conf.j2
    dest: "/etc/nginx/conf.d/{{ webapp_name }}.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c %s"
  notify: Reload nginx
  become: true

- name: Create web root directory
  ansible.builtin.file:
    path: "/var/www/{{ webapp_name }}"
    state: directory
    owner: "{{ webapp_user }}"
    group: "{{ webapp_group }}"
    mode: "0755"
  become: true

- name: Install logrotate policy for nginx
  ansible.builtin.template:
    src: logrotate-nginx.j2
    dest: /etc/logrotate.d/nginx
    owner: root
    group: root
    mode: "0644"
  when: webapp_logrotate_enabled
  become: true
